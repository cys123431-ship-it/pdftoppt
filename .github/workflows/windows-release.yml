name: CI And Windows Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag override (for example v1.5.0). Leave empty to use VERSION."
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-and-release:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $version = (Get-Content VERSION -Raw).Trim()
            if ([string]::IsNullOrWhiteSpace($version)) {
              throw "VERSION is empty."
            }
            $tag = "v$version"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --version=5.5.3.20260724 -y --no-progress
          $tessRoot = Join-Path $env:ProgramFiles "Tesseract-OCR"
          $tessData = Join-Path $tessRoot "tessdata"
          $modelBase = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0"
          Invoke-WebRequest "$modelBase/eng.traineddata" -OutFile (Join-Path $tessData "eng.traineddata")
          Invoke-WebRequest "$modelBase/kor.traineddata" -OutFile (Join-Path $tessData "kor.traineddata")
          Invoke-WebRequest "$modelBase/osd.traineddata" -OutFile (Join-Path $tessData "osd.traineddata")
          "TESSERACT_CMD=$(Join-Path $tessRoot 'tesseract.exe')" >> $env:GITHUB_ENV
          "TESSDATA_PREFIX=$tessData" >> $env:GITHUB_ENV

      - name: Verify OCR runtime
        shell: pwsh
        run: |
          & $env:TESSERACT_CMD --version
          python -c "from ocr_tools import ensure_ocr_ready, list_ocr_languages; print(ensure_ocr_ready('kor+eng')); print(sorted(list_ocr_languages()))"

      - name: Prepare bundled OCR runtime
        shell: pwsh
        run: |
          $src = Join-Path $env:ProgramFiles "Tesseract-OCR"
          $dst = Join-Path $PWD "vendor\tesseract"
          $dstData = Join-Path $dst "tessdata"
          New-Item -ItemType Directory -Force -Path $dstData | Out-Null
          Copy-Item (Join-Path $src "tesseract.exe") $dst
          Get-ChildItem $src -Filter "*.dll" | Copy-Item -Destination $dst
          foreach ($name in @("eng.traineddata", "kor.traineddata", "osd.traineddata", "pdf.ttf")) {
            $source = Join-Path (Join-Path $src "tessdata") $name
            if (Test-Path $source) { Copy-Item $source $dstData }
          }
          foreach ($folder in @("configs", "tessconfigs")) {
            $source = Join-Path (Join-Path $src "tessdata") $folder
            if (Test-Path $source) { Copy-Item $source $dstData -Recurse }
          }
          foreach ($licenseName in @("LICENSE", "COPYING")) {
            $source = Join-Path $src $licenseName
            if (Test-Path $source) { Copy-Item $source $dst }
          }

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --noconsole --onefile --name PDFConverter `
            --add-data "vendor\tesseract;tesseract" `
            --add-data "THIRD_PARTY_NOTICES.md;." `
            main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFConverter-windows-exe
          path: dist/PDFConverter.exe

      - name: Create release tag
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (git rev-parse -q --verify "refs/tags/$tag") {
            Write-Host "Tag $tag already exists; using the existing tag."
          } else {
            git tag -a $tag -m "Release $tag"
            git push origin $tag
          }

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/PDFConverter.exe
            THIRD_PARTY_NOTICES.md
